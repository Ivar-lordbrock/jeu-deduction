<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Scène provisoire de l'affaire de démonstration, à remplacer par une vraie illustration. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a201b"/>
      <stop offset="1" stop-color="#43332a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3427"/>
      <stop offset="1" stop-color="#22170f"/>
    </linearGradient>
    <radialGradient id="fireGlow">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candleGlow">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Murs et sol -->
  <rect width="1600" height="640" fill="url(#wall)"/>
  <g stroke="#3a2c24" stroke-width="3" opacity="0.5">
    <line x1="120" y1="0" x2="120" y2="600"/><line x1="440" y1="0" x2="440" y2="600"/>
    <line x1="1160" y1="0" x2="1160" y2="600"/><line x1="1480" y1="0" x2="1480" y2="600"/>
  </g>
  <rect y="600" width="1600" height="40" fill="#35271f"/>
  <rect y="640" width="1600" height="260" fill="url(#floor)"/>
  <g stroke="#2b1e15" stroke-width="2" opacity="0.7">
    <line x1="0" y1="690" x2="1600" y2="690"/><line x1="0" y1="752" x2="1600" y2="752"/>
    <line x1="0" y1="826" x2="1600" y2="826"/>
  </g>

  <!-- Fenêtre -->
  <rect x="640" y="90" width="320" height="300" fill="#141c2a"/>
  <circle cx="880" cy="165" r="28" fill="#d8d3bf" opacity="0.85"/>
  <rect x="640" y="90" width="320" height="300" fill="none" stroke="#6b5444" stroke-width="14"/>
  <line x1="800" y1="90" x2="800" y2="390" stroke="#6b5444" stroke-width="10"/>
  <line x1="640" y1="240" x2="960" y2="240" stroke="#6b5444" stroke-width="10"/>
  <path d="M610 75 L670 75 Q655 240 680 410 L610 410 Z" fill="#5a1d22"/>
  <path d="M990 75 L930 75 Q945 240 920 410 L990 410 Z" fill="#5a1d22"/>
  <rect x="595" y="66" width="410" height="12" rx="6" fill="#8a6a3a"/>

  <!-- Portrait au mur -->
  <rect x="200" y="140" width="180" height="230" fill="#4f3c2f" stroke="#b08d57" stroke-width="10"/>
  <ellipse cx="290" cy="225" rx="38" ry="46" fill="#6a5545"/>
  <path d="M225 365 Q290 270 355 365 Z" fill="#3b2c22"/>

  <!-- Buffet -->
  <rect x="70" y="470" width="320" height="170" fill="#3d2a1f"/>
  <rect x="88" y="492" width="134" height="128" fill="#4a3426" stroke="#2c1d14" stroke-width="3"/>
  <rect x="238" y="492" width="134" height="128" fill="#4a3426" stroke="#2c1d14" stroke-width="3"/>
  <circle cx="210" cy="556" r="5" fill="#b08d57"/>
  <circle cx="250" cy="556" r="5" fill="#b08d57"/>
  <rect x="60" y="458" width="340" height="16" fill="#563d2d"/>

  <!-- Testament posé sur le buffet -->
  <g transform="rotate(-8 252 426)">
    <rect x="215" y="392" width="74" height="68" fill="#efe6cf"/>
    <g stroke="#8a7a62" stroke-width="2">
      <line x1="224" y1="405" x2="280" y2="405"/>
      <line x1="224" y1="415" x2="280" y2="415"/>
      <line x1="224" y1="425" x2="280" y2="425"/>
      <line x1="224" y1="435" x2="266" y2="435"/>
    </g>
    <line x1="250" y1="450" x2="282" y2="450" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Cheminée -->
  <rect x="1360" y="360" width="220" height="280" fill="#5b4c44"/>
  <rect x="1395" y="440" width="150" height="200" fill="#120c0a"/>
  <path d="M1425 640 Q1430 585 1450 600 Q1458 540 1478 595 Q1492 565 1500 600 Q1515 590 1515 640 Z" fill="#e8873a"/>
  <path d="M1445 640 Q1455 605 1470 615 Q1478 590 1490 640 Z" fill="#ffd27a"/>
  <rect x="1345" y="345" width="250" height="24" fill="#6e5d53"/>
  <circle cx="1470" cy="590" r="190" fill="url(#fireGlow)"/>

  <!-- Le cuisinier -->
  <ellipse cx="445" cy="792" rx="60" ry="10" fill="#000" opacity="0.35"/>
  <rect x="412" y="640" width="28" height="150" fill="#2d2622"/>
  <rect x="450" y="640" width="28" height="150" fill="#2d2622"/>
  <path d="M445 392 C410 396 398 425 398 465 L402 655 L488 655 L492 465 C492 425 480 396 445 392 Z" fill="#d9d2c3"/>
  <path d="M415 470 L475 470 L482 700 L408 700 Z" fill="#f4f1e8"/>
  <text x="445" y="500" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#8a3b2b" text-anchor="middle">B</text>
  <path d="M405 420 L392 560 L408 562 L420 430 Z" fill="#cfc7b6"/>
  <path d="M480 420 L520 445 L515 458 L476 440 Z" fill="#cfc7b6"/>
  <ellipse cx="512" cy="452" rx="40" ry="7" fill="#b9b9b9"/>
  <path d="M488 450 Q512 420 536 450 Z" fill="#cfcfcf"/>
  <circle cx="445" cy="358" r="30" fill="#c99f7f"/>
  <rect x="418" y="305" width="54" height="32" fill="#f4f1e8"/>
  <circle cx="430" cy="303" r="16" fill="#f4f1e8"/>
  <circle cx="460" cy="303" r="16" fill="#f4f1e8"/>
  <circle cx="445" cy="294" r="18" fill="#f4f1e8"/>

  <!-- Chaise et corps du duc (derrière la table) -->
  <rect x="565" y="400" width="14" height="170" fill="#3a2516"/>
  <rect x="625" y="400" width="14" height="170" fill="#3a2516"/>
  <rect x="565" y="400" width="74" height="16" fill="#4a3020"/>
  <rect x="565" y="450" width="74" height="10" fill="#4a3020"/>
  <path d="M600 600 C590 540 600 478 660 466 C700 458 738 470 750 495 L742 540 C705 548 650 560 640 600 Z" fill="#2b3552"/>
  <path d="M662 468 C700 460 735 472 748 496" fill="none" stroke="#c9a24a" stroke-width="4"/>

  <!-- Table -->
  <ellipse cx="855" cy="795" rx="380" ry="16" fill="#000" opacity="0.35"/>
  <rect x="515" y="662" width="18" height="128" fill="#3a2516"/>
  <rect x="1177" y="662" width="18" height="128" fill="#3a2516"/>
  <polygon points="540,515 1170,515 1205,560 505,560" fill="#7d2a2f"/>
  <polygon points="505,560 1205,560 1215,662 495,662" fill="#6a1f25"/>
  <g stroke="#561920" stroke-width="3">
    <line x1="640" y1="562" x2="636" y2="660"/><line x1="800" y1="562" x2="798" y2="660"/>
    <line x1="960" y1="562" x2="962" y2="660"/><line x1="1100" y1="562" x2="1104" y2="660"/>
  </g>
  <ellipse cx="690" cy="545" rx="45" ry="9" fill="#e8e2d4"/>
  <ellipse cx="1010" cy="540" rx="45" ry="9" fill="#e8e2d4"/>

  <!-- Chandelier -->
  <circle cx="1100" cy="440" r="90" fill="url(#candleGlow)"/>
  <ellipse cx="1100" cy="548" rx="20" ry="5" fill="#b08d57"/>
  <rect x="1096" y="470" width="8" height="78" fill="#b08d57"/>
  <rect x="1093" y="440" width="14" height="30" fill="#efe6cf"/>
  <ellipse cx="1100" cy="430" rx="6" ry="12" fill="#ffd27a"/>

  <!-- Coupe renversée et vin répandu -->
  <ellipse cx="985" cy="549" rx="55" ry="8" fill="#33050c"/>
  <circle cx="1048" cy="553" r="3.5" fill="#33050c"/>
  <path d="M900 528 Q930 522 948 530 L948 548 Q930 553 900 546 Z" fill="#c8b98a"/>
  <rect x="882" y="534" width="20" height="6" fill="#c8b98a"/>
  <ellipse cx="880" cy="537" rx="4" ry="12" fill="#b0a170"/>

  <!-- Bras et tête du duc, posés sur la table -->
  <path d="M690 500 L848 518 L846 538 L688 528 Z" fill="#2b3552"/>
  <circle cx="858" cy="529" r="11" fill="#c99f7f"/>
  <circle cx="861" cy="522" r="4.5" fill="#e2b84a" stroke="#8a6a2a" stroke-width="1"/>
  <ellipse cx="768" cy="500" rx="32" ry="26" fill="#c99f7f"/>
  <path d="M738 492 Q766 466 800 488 Q792 476 768 474 Q746 476 738 492 Z" fill="#a8a8a8"/>

  <!-- La jeune femme -->
  <ellipse cx="1245" cy="792" rx="70" ry="10" fill="#000" opacity="0.35"/>
  <polygon points="1283,500 1302,494 1305,512 1286,517" fill="#efe6cf"/>
  <path d="M1245 380 C1215 388 1205 425 1210 470 L1172 790 L1318 790 L1280 470 C1285 425 1275 388 1245 380 Z" fill="#4b2b52"/>
  <path d="M1212 470 L1278 470 L1280 485 L1210 485 Z" fill="#2f1a34"/>
  <path d="M1215 400 C1200 430 1196 480 1200 540 L1214 540 C1214 485 1220 440 1228 410 Z" fill="#43264a"/>
  <circle cx="1207" cy="545" r="8" fill="#c99f7f"/>
  <rect x="1238" y="366" width="14" height="20" fill="#c99f7f"/>
  <circle cx="1245" cy="345" r="29" fill="#c99f7f"/>
  <path d="M1216 345 Q1214 312 1245 310 Q1276 312 1274 345 Q1268 325 1245 323 Q1222 325 1216 345 Z" fill="#3b2416"/>
  <circle cx="1270" cy="318" r="13" fill="#3b2416"/>
  <circle cx="1245" cy="398" r="7" fill="#e2b84a" stroke="#8a6a2a" stroke-width="1.5"/>
  <circle cx="1245" cy="398" r="3" fill="#7a1f3a"/>

  <!-- Fiole tombée près de la cheminée, et son bouchon -->
  <g transform="rotate(-15 1365 820)">
    <rect x="1343" y="812" width="34" height="16" rx="7" fill="#7fa7a0" opacity="0.9"/>
    <rect x="1376" y="815" width="10" height="10" fill="#7fa7a0" opacity="0.9"/>
  </g>
  <rect x="1402" y="830" width="8" height="11" rx="2" fill="#8a6a4a"/>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
